<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <defs>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- arc -->
  <path d="M 60 70 A 220 220 0 0 1 500 70" fill="none" stroke="url(#arc)" stroke-width="8" stroke-linecap="round"/>
  <!-- dashes finishing the arc in orange -->
  <g stroke="#f97316" stroke-width="8" stroke-linecap="round">
    <line x1="497" y1="55" x2="503" y2="72"/>
    <line x1="487" y1="40" x2="494" y2="57"/>
    <line x1="474" y1="27" x2="482" y2="43"/>
  </g>

  <!-- simplified tow truck glyph -->
  <g transform="translate(178,42)">
    <rect x="0" y="34" width="46" height="7" rx="2" fill="#f97316"/>
    <path d="M0 34 L0 20 L34 20 L48 34 Z" fill="#0f172a"/>
    <rect x="34" y="8" width="30" height="26" rx="4" fill="#0f172a"/>
    <rect x="40" y="12" width="12" height="10" rx="1" fill="#ffffff"/>
    <circle cx="14" cy="44" r="7" fill="#0f172a"/>
    <circle cx="14" cy="44" r="3" fill="#ffffff"/>
    <circle cx="54" cy="44" r="7" fill="#0f172a"/>
    <circle cx="54" cy="44" r="3" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#0f172a" letter-spacing="2">QUICK</text>
  <text x="280" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#f97316" letter-spacing="6">AUTO RECOVERY</text>

  <!-- divider -->
  <path d="M 130 162 L 260 162 L 280 172 L 300 162 L 430 162" fill="none" stroke="#0f172a" stroke-width="2"/>

  <!-- tagline -->
  <text x="280" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" fill="#0f172a" letter-spacing="1">FAST RESPONSE. SAFE RECOVERY. 24/7 SERVICE.</text>
</svg>
